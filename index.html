<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pt1000 Umbreytir</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Pt1000 Umbreytir</h1>
    <p class="subtitle">IEC 60751 — Umbreyttu á milli viðnáms (Ω) og hitastigs (°C)</p>

    <div class="card">
      <div class="input-group">
        <input type="number" id="resistance" placeholder="Ω" step="0.1" />
        <label>Viðnám (Ω)</label>
      </div>
      <div class="arrow">⇄</div>
      <div class="input-group">
        <input type="number" id="temperature" placeholder="°C" step="0.1" />
        <label>Hitastig (°C)</label>
      </div>
    </div>

    <p class="result" id="result">Sláðu inn gildi til að byrja</p>
    <p class="info">Pt1000: 1000 Ω við 0 °C &nbsp;|&nbsp; Svið: −200 °C til +850 °C</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
