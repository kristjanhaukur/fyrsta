<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fyrsta vefforritið</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Hitastigsbreytir</h1>
    <p class="subtitle">Breyttu á milli Celsius og Fahrenheit</p>

    <div class="card">
      <div class="input-group">
        <input type="number" id="celsius" placeholder="°C" />
        <label>Celsius</label>
      </div>
      <div class="arrow">⇄</div>
      <div class="input-group">
        <input type="number" id="fahrenheit" placeholder="°F" />
        <label>Fahrenheit</label>
      </div>
    </div>

    <p class="result" id="result">Sláðu inn gildi til að byrja</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
